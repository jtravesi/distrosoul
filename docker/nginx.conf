# nginx config for distrosoul (production).
#
# Hardened for a static SPA:
#   - Strict security headers
#   - Long cache for assets, no-cache for index.html
#   - No server-version leakage
#   - SPA fallback so client-side routes don't 404

# Hide nginx version from response headers
server_tokens off;

# Reasonable defaults for a single-page app
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    # These are applied to all responses below. The CSP allows Google Fonts
    # because we use them; everything else is locked down.

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Content Security Policy:
    #   - default-src 'self'        : only our own origin
    #   - style-src   includes Google Fonts + 'unsafe-inline' for Vite
    #   - font-src    Google Fonts CDN
    #   - img-src     'self' + data: for inline SVGs / base64 if needed
    #   - media-src   'self' for the optional /audio/test-theme.ogg
    #   - script-src  only 'self' (no inline, no eval)
    #   - connect-src 'self' only
    #   - frame-ancestors 'none' (defense in depth with X-Frame-Options)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # -------------------------------------------------------------------------
    # Caching
    # -------------------------------------------------------------------------

    # Hashed assets from Vite — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Re-apply security headers (add_header inside location overrides outer)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # index.html — never cache, so deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # -------------------------------------------------------------------------
    # SPA fallback
    # -------------------------------------------------------------------------
    # Any path that doesn't match a real file falls back to index.html
    # so that React Router (if we ever add it) handles routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide hidden files (.git, .env, etc.) just in case
    location ~ /\. {
        deny all;
        return 404;
    }
}
