# Production compose file for distrosoul.
#
# Usage:
#   docker compose up -d --build
#
# The container exposes port 80 internally. Map it to whatever you want
# on the host (default: 8080).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: distrosoul:latest
    container_name: distrosoul
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    # No volumes: the image is fully self-contained.
    # No env vars needed: this is a static site.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--tries=1", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Hardening: drop all capabilities, read-only fs where possible
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
